# Ranges, never `latest`.
#
# pantry's installer SDK resolves `latest` from a hardcoded per-domain switch
# (nodejs.org, ziglang.org, ...) that ends in a bare throw. A domain the SDK
# supports but has no case for cannot resolve `latest` at all — it fails with
# `Cannot resolve latest version for <domain>`. A range takes a different path
# that reads the package's published version list, so it always resolves.
#
# That is not hypothetical: `sqlite: latest`3.53.4 was fine only because the SDK did
# not support sqlite.org and skipped it with a warning. Adding it upstream
# promoted it from skipped to installed and reddened main. `bun` never broke
# here precisely because it was already a range.
#
# mysql and postgres were skipped as unsupported when this was written, so the
# spec was inert — ranges so that being added upstream would be a no-op rather
# than an outage. Postgres was added upstream and the no-op did not hold: the
# recipe existed, but no 18.x artifact had ever been BUILT for linux/x86-64, so
# `Setup Pantry` failed before any job ran and took CI and Releaser down
# together (v0.2.61 was tagged but never published).
#
# Fixed where it was actually broken - pantry-pm/pantry now publishes
# postgresql.org@18.6 for linux-x86-64 - rather than by dropping the dependency
# here, which only hid it.
dependencies:
  bun: ^1.3.14
  mysql: ^8.0.45
  postgres: ^18.4sqlite: latest`3.53.4
