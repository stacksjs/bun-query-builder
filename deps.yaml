# Ranges, never `latest`.
#
# pantry's installer SDK resolves `latest` from a hardcoded per-domain switch
# (nodejs.org, ziglang.org, ...) that ends in a bare throw. A domain the SDK
# supports but has no case for cannot resolve `latest` at all — it fails with
# `Cannot resolve latest version for <domain>`. A range takes a different path
# that reads the package's published version list, so it always resolves.
#
# That is not hypothetical: `sqlite: latest` was fine only because the SDK did
# not support sqlite.org and skipped it with a warning. Adding it upstream
# promoted it from skipped to installed and reddened main. `bun` never broke
# here precisely because it was already a range.
#
# mysql and postgres were skipped as unsupported when this was written, so the
# spec was inert — ranges so that being added upstream would be a no-op rather
# than an outage. Postgres has since been added upstream, and the no-op did not
# hold: every spec tried resolves to a version the registry has no
# linux/x86-64 artifact for, `18.0.0` and `^18.0.0` alike.
#
#   Required system package postgres@18.0.0 failed to install: Cannot install
#   postgresql.org@18.0.0: no built-in resolver, and the registry publishes no
#   linux-x86-64 artifact for that version
#
# `Setup Pantry` runs before every job, so this took down CI and Releaser
# together and v0.2.61 was tagged but never published.
#
# Dropped rather than pinned. Nothing here needs a postgres BINARY: it was
# skipped for the whole life of this file and CI was green throughout, so
# requesting it only ever asked for something the build does not use. The
# postgres integration test spawns its own subprocess against a running server
# and skips without one, exactly as before.
#
# mysql is the same bet still outstanding — inert only while pantry skips it.
# If it is added upstream and its spec cannot resolve, this is the file, and
# the fix is the same one.
dependencies:
  bun: ^1.3.14
  mysql: ^8.0.45
  sqlite: ^3.52.0
