name: Releaser

on:
  push:
    tags:
      - 'v*'
  # Releases a tag that npm already has: its binaries and GitHub Release,
  # without publishing it again. Uploading an accepted version a second time
  # can stage a conflicting copy, so a manual run never publishes.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag already on npm, such as v0.3.27
        required: true

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The readback script runs from this commit, since an older tag predates it.
      - name: Check out the tag to release
        run: |
          cp .github/scripts/npm-publication-readback.ts "$RUNNER_TEMP/"
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            exit 0
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag"
            exit 1
          fi
          git checkout --detach "refs/tags/$RELEASE_TAG"
          version=$(jq -r .version packages/bun-query-builder/package.json)
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::$RELEASE_TAG carries version $version"
            exit 1
          fi

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@v0.11.145

      - name: Install Dependencies
        run: bun install --ignore-scripts

      - name: Build Package
        if: github.event_name == 'push'
        working-directory: packages/bun-query-builder
        run: bun --bun build.ts

      - name: Verify Package
        if: github.event_name == 'push'
        run: >-
          bun -e "import { isLosslessTypeChange } from './packages/bun-query-builder/dist/src/index.js';
          if (!isLosslessTypeChange('integer', 'bigint') || !isLosslessTypeChange('string', 'text'))
          throw new Error('published package build is stale')"

      # Publish once and keep the outcome; the readback below decides it.
      #
      # `pantry publish` exits 1 when npm accepts the upload but its own public
      # readback has not finished inside the 120s it waits, and npm often takes
      # three or four minutes to serve a new version. Failing there skipped the
      # binaries and the GitHub Release: v0.3.14, 0.3.18, 0.3.20, 0.3.24, 0.3.25,
      # 0.3.27 and 0.3.28 all reached npm with neither (#1197).
      - name: Publish
        id: publish
        if: github.event_name == 'push'
        working-directory: packages/bun-query-builder
        run: |
          mkdir -p ../../artifacts/npm-publication
          set +e
          pantry publish --npm --access public 2>&1 | tee ../../artifacts/npm-publication/publish.log
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${statuses[1]}" -ne 0 ]; then
            exit "${statuses[1]}"
          fi
          echo "exit_code=${statuses[0]}" >> "$GITHUB_OUTPUT"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Waits up to 15 minutes for npm to serve the version, then checks that
      # its metadata, tarball bytes and the manifest inside the tarball match
      # the archive the publish log says npm accepted. A rejected upload, a
      # missing or conflicting receipt, or a mismatch fails the release here.
      # It never uploads. On a manual run it confirms npm already has the tag.
      - name: Read the release back from npm
        id: readback
        run: bun "$RUNNER_TEMP/npm-publication-readback.ts"
        env:
          PANTRY_NPM_PUBLISH_EXIT_CODE: ${{ steps.publish.outputs.exit_code }}

      - name: Retain the npm publication evidence
        if: always() && steps.readback.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: npm-publication-proof
          path: artifacts/npm-publication/
          if-no-files-found: error

      - name: Build Release Binaries
        run: cd packages/bun-query-builder && bun run compile:all && bun run zip

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.11
        with:
          tag: ${{ env.RELEASE_TAG }}
          files: |
            packages/bun-query-builder/bin/qbx-linux-x64.zip
            packages/bun-query-builder/bin/qbx-linux-arm64.zip
            packages/bun-query-builder/bin/qbx-windows-x64.zip
            packages/bun-query-builder/bin/qbx-darwin-x64.zip
            packages/bun-query-builder/bin/qbx-darwin-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The releaser marks what it creates as the latest release, which is
      # wrong for an older tag released by hand: v0.3.28 took the badge from
      # v0.3.29. Hand it back to the highest version that has a release.
      - name: Keep the newest version marked latest
        if: github.event_name == 'workflow_dispatch'
        run: |
          newest=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          gh release edit "$newest" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
